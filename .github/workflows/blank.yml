name: CI

on:
  pull_request: ~
  push:
    branches: [main, dev]
  workflow_dispatch: ~

permissions:
  contents: read
  actions: read

jobs:

  linux:
    name: Linux
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    secrets: inherit
    with:
      task: |
        curl -fsSL https://xmake.io/shget.text | bash
        export PATH="$HOME/.local/bin:$PATH"
        xrepo install -y libsdl3 libsdl3_ttf
      matrix: >
        [
          {"platform_name":"ubuntu","os":"ubuntu-latest","arch":"x86_64","toolchain":"gcc","perl_version":"5.40.5"},
          {"platform_name":"ubuntu","os":"ubuntu-latest","arch":"x86_64","toolchain":"gcc","perl_version":"5.42.3","configure":"-Duselongdouble","variant":"longdoubles"},
          {"platform_name":"ubuntu-arm","os":"ubuntu-24.04-arm","arch":"aarch64","toolchain":"gcc","perl_version":"5.40.5"},
          {"platform_name":"ubuntu","os":"ubuntu-latest","arch":"x86_64","toolchain":"clang","perl_version":"5.40.5"},
          {"platform_name":"ubuntu-arm","os":"ubuntu-24.04-arm","arch":"aarch64","toolchain":"clang","perl_version":"5.40.5"}
        ]

  macos:
    name: macOS
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    secrets: inherit
    with:
      task: |
        brew install xmake
        xrepo install -y libsdl3 libsdl3_ttf
      matrix: >
        [
          {"platform_name":"macos","os":"macos-15","arch":"aarch64","toolchain":"gcc","perl_version":"5.42.3"},
          {"platform_name":"macos-intel","os":"macos-15-intel","arch":"x86_64","toolchain":"gcc","perl_version":"5.42.3"},
          {"platform_name":"macos","os":"macos-15","arch":"aarch64","toolchain":"clang","perl_version":"5.42.3"},
          {"platform_name":"macos-intel","os":"macos-15-intel","arch":"x86_64","toolchain":"clang","perl_version":"5.42.3"}
        ]

  windows:
    name: Windows
    uses: sanko/workflow-testing/.github/workflows/run-direct.yml@main
    secrets: inherit
    with:
      #~ This task runs under git-bash (run-direct.yml `shell: bash`), but
      #~ native xmake.exe spawns from deep perl-under-bash chains fail with
      #~ "Inappropriate I/O control operation" (EINVAL on CreateProcess). That
      #~ is a CI-env artifact, not a code bug: t/00-05 pass under PowerShell
      #~ (native Win32 spawning), which is what the passing 0.08 release used.
      #~ So build + test on PowerShell, keeping strawberry perl on PATH.
      #~ xmake-repo's source-built libsdl3_ttf needs freetype, but Strawberry
      #~ Perl (installed by `prepare`) ships its own mingw freetype/zlib, which
      #~ xmake's generic system-detection mistakes for usable packages
      #~ ("system::freetype") even though SDL3_ttf's CMake cannot consume them
      #~ ("Could NOT find Freetype"). Quarantine the Strawberry copies so xmake
      #~ builds freetype/zlib from source, and pin the mingw toolchain to
      #~ Strawberry so `ar`/`ninja` resolve consistently. The xmake package
      #~ cache then serves later build steps without re-detecting the system
      #~ packages.
      task: |
        winget install xmake --accept-source-agreements
        for d in "/c/Program Files/xmake" "$LOCALAPPDATA/Programs/xmake" "$LOCALAPPDATA/xmake"; do
          if [ -f "$d/xrepo.bat" ]; then XREPO="$d/xrepo.bat"; break; fi
        done
        if [ -z "${XREPO:-}" ]; then
          echo "xrepo.bat not found; searching install locations:"
          ls -la "/c/Program Files/xmake" 2>/dev/null || true
          ls -la "$LOCALAPPDATA/Programs/xmake" 2>/dev/null || true
          ls -la "$LOCALAPPDATA/xmake" 2>/dev/null || true
          where.exe xmake 2>/dev/null || true
          exit 1
        fi
        Q="/c/Strawberry/c"
        for p in include/freetype2 include/zlib.h include/zconf.h; do
          if [ -e "$Q/$p" ]; then mv "$Q/$p" "$Q/$p.off"; fi
        done
        for f in "$Q"/lib/libfreetype*.a "$Q"/lib/libz*.a "$Q"/bin/libfreetype*.dll "$Q"/bin/libz*.dll; do
          if [ -e "$f" ]; then mv "$f" "$f.off"; fi
        done
        # Build zlib + freetype in their own transaction first, then install
        # the SDL packages once that dependency chain is cached. Running all
        # four in one `-j 6` transaction lets the per-package mingw toolchain
        # config race each other on this runner (zlib and libsdl3 each died in
        # different random ways across runs). A hard timeout still guards
        # against stalls, and any installdir.failed log is dumped in-band.
        dump_failed() {
          for f in $(find "$LOCALAPPDATA/.xmake/cache/packages" -path "*installdir.failed*" -name install.txt 2>/dev/null); do
            echo "===== $f ====="
            tail -n 120 "$f"
          done
        }
        set +e
        timeout 1500 "$XREPO" install -y -p mingw --mingw="C:/Strawberry/c" -v zlib freetype
        ec1=$?
        dump_failed
        if [ $ec1 -ne 0 ]; then
          echo "zlib/freetype install failed (exit=$ec1, 124 = timed out)"
          exit $ec1
        fi
        timeout 1500 "$XREPO" install -y -p mingw --mingw="C:/Strawberry/c" -v libsdl3 libsdl3_ttf
        ec2=$?
        set -e
        echo "libsdl3/libsdl3_ttf install exit=$ec2 (124 = timed out)"
        dump_failed
        exit $ec2
      matrix: >
        [
          {"platform_name":"windows","os":"windows-latest","arch":"x86_64","toolchain":"gcc","prepare":"choco install strawberryperl"},
          {"platform_name":"windows","os":"windows-latest","arch":"x86_64","toolchain":"clang","prepare":"choco install llvm strawberryperl"}
        ]

  results:
    name: Summary
    if: always()
    needs: [linux, macos, windows]
    uses: sanko/workflow-testing/.github/workflows/results-summary.yml@main
